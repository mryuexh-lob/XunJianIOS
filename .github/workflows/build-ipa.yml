name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import signing certificate & provisioning profile
        if: ${{ secrets.IOS_CERTIFICATE != '' }}
        env:
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "$IOS_CERT" | base64 --decode > cert.p12
          echo "$IOS_PROFILE" | base64 --decode > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERT_PWD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (manual signing)
        if: ${{ secrets.IOS_CERTIFICATE != '' }}
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project XunJianIOS.xcodeproj -scheme XunJianIOS \
            -configuration Release \
            -archivePath build/XunJianIOS.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM \
            PROVISIONING_PROFILE_SPECIFIER="XunJianIOS Profile" \
            clean archive

      - name: Archive (automatic signing)
        if: ${{ secrets.IOS_CERTIFICATE == '' }}
        run: |
          xcodebuild -project XunJianIOS.xcodeproj -scheme XunJianIOS \
            -configuration Release \
            -archivePath build/XunJianIOS.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            clean archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/XunJianIOS.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XunJianIOS-ipa
          path: build/ipa/*.ipa
